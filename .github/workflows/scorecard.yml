name: OpenSSF Scorecard

on:
  schedule:
    - cron: "27 5 * * 1"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: scorecard-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analysis:
    name: Supply-chain posture
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read # Read repository contents for the posture checks.
      actions: read # Inspect workflow run history for the posture checks.
      security-events: write # Publish results to the code-scanning view.
      id-token: write # Sigstore OIDC identity for the signed result.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Run analysis
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: scorecard-results.sarif
          results_format: sarif
          publish_results: false

      - name: Upload results to code scanning
        uses: github/codeql-action/upload-sarif@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4.37.8
        with:
          sarif_file: scorecard-results.sarif
