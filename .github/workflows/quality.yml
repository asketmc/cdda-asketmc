name: KISS PR gate

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  portable-contracts:
    name: Portable contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      # Read-only checkout of this repository; this gate publishes nothing.
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Fetch immutable 0.G audit baseline
        run: git fetch --no-tags --depth=1 https://github.com/CleverRaven/Cataclysm-DDA.git d6ec466140839dd70c1a43671eb4a08b007695c2
      - name: Install graphics-test dependencies
        run: python3 -m pip install --disable-pip-version-check -r tools/gfx_tools/ultica_hires/requirements.txt
      - name: Validate GitHub Actions workflows
        run: |
          curl --fail --location --retry 3 \
            --output actionlint.tar.gz \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  actionlint.tar.gz" | sha256sum --check
          tar -xzf actionlint.tar.gz actionlint
          ./actionlint

      - name: Audit GitHub Actions workflows for security defects
        run: |
          curl --fail --location --retry 3 \
            --output zizmor.tar.gz \
            https://github.com/zizmorcore/zizmor/releases/download/v1.29.0/zizmor-x86_64-unknown-linux-gnu.tar.gz
          echo "dd96df044a6e8538d5f423790f453bdd03d49e5b2bcc38214acc41a2f1297839  zizmor.tar.gz" | sha256sum --check
          tar -xzf zizmor.tar.gz zizmor
          ./zizmor --no-online-audits --persona=pedantic --min-severity=low .github/workflows
      - name: Python feature contracts
        run: |
          python3 -m unittest \
            tools.test_package_windows_release \
            tools.test_release_changelog \
            tools.test_windows_release_workflow \
            tools.test_h5_interface_qol \
            tools.test_h6_antigrind \
            tools.test_h6_backup_generator \
            tools.test_windows_audio_recovery \
            tools.gfx_tools.test_backport_tileset_release \
            tools.gfx_tools.test_build_ultica_hires \
            tools.gfx_tools.test_beauty_backport_assets \
            tools.gfx_tools.test_visual_ui_donor_contracts
      - name: Validate reviewed changelog input and generated release history
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          PUSH_HEAD_SHA: ${{ github.sha }}
        run: |
          python3 tools/release_changelog.py lint --check-generated
          if [[ "${GITHUB_EVENT_NAME}" == "pull_request" ]]; then
            python3 tools/release_changelog.py check-pr \
              --base "${PR_BASE_SHA}" \
              --head "${PR_HEAD_SHA}" \
              --pr "${PR_NUMBER}"
          elif [[ "${GITHUB_EVENT_NAME}" == "push" ]]; then
            python3 tools/release_changelog.py check-main \
              --base "${PUSH_BEFORE_SHA}" \
              --head "${PUSH_HEAD_SHA}"
          fi
      - name: Additive audit self-test
        run: python3 tools/additive_audit.py --self-test
      - name: Fail-closed additive audit
        run: python3 tools/additive_audit.py --target HEAD
