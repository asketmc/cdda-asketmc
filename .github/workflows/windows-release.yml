name: Windows build and release

on:
  pull_request:
  push:
    tags:
      - "v0.G-additive-*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-build-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  windows-compile:
    name: Windows Tiles+Sound (MXE GCC 11)
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      # Source checkout only; caches and artifacts use the Actions runtime token.
      contents: read
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_COMPRESS: "true"
      CCACHE_MAXSIZE: 2G
      RELEASE_BUILD: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v0.G-additive-') }}
      TOOLCHAIN_CACHE: ${{ github.workspace }}/.toolchain-cache
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify reviewed release boundary before toolchain acquisition
        if: env.RELEASE_BUILD == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "${GITHUB_SHA}" origin/main
          python3 tools/release_changelog.py validate-tag \
            --tag "${GITHUB_REF_NAME}" \
            --expected-commit "${GITHUB_SHA}"
          previous_release=$(python3 tools/release_changelog.py release-field \
            --tag "${GITHUB_REF_NAME}" --field previous_release)
          test "$(gh release view "${previous_release}" --repo "${GITHUB_REPOSITORY}" \
            --json isDraft --jq '.isDraft')" = "false"

      - name: Prepare reviewed release documents
        if: env.RELEASE_BUILD == 'true'
        run: |
          set -euo pipefail
          mkdir -p release-source
          python3 tools/release_changelog.py render-release \
            --tag "${GITHUB_REF_NAME}" \
            --output release-source/RELEASE_NOTES.md
          python3 tools/release_changelog.py build-metadata \
            --tag "${GITHUB_REF_NAME}" \
            --commit "${GITHUB_SHA}" \
            --notes release-source/RELEASE_NOTES.md \
            --output release-source/RELEASE_METADATA.json

      - name: Install host tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes ccache wine64

      - name: Restore MXE archives
        id: mxe-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.TOOLCHAIN_CACHE }}
          key: mxe-gcc11.2-x86_64-${{ hashFiles('build-scripts/mxe-x86_64-gcc11.2-sha256', 'build-scripts/libbacktrace-x86_64-w64-mingw32-sha256') }}

      - name: Download MXE archives
        if: steps.mxe-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p "${TOOLCHAIN_CACHE}"
          curl --fail --location --retry 3 \
            --output "${TOOLCHAIN_CACHE}/mxe-x86_64.tar.xz" \
            https://github.com/BrettDong/MXE-GCC/releases/download/mxe-gcc-11.2/mxe-x86_64.tar.xz
          curl --fail --location --retry 3 \
            --output "${TOOLCHAIN_CACHE}/libbacktrace-x86_64-w64-mingw32.tar.gz" \
            https://github.com/Qrox/libbacktrace/releases/download/2020-01-03/libbacktrace-x86_64-w64-mingw32.tar.gz

      - name: Verify MXE archives
        run: |
          cd "${TOOLCHAIN_CACHE}"
          sha256sum --check "${GITHUB_WORKSPACE}/build-scripts/mxe-x86_64-gcc11.2-sha256"
          sha256sum --check "${GITHUB_WORKSPACE}/build-scripts/libbacktrace-x86_64-w64-mingw32-sha256"

      - name: Save verified MXE archives for trusted events
        if: steps.mxe-cache.outputs.cache-hit != 'true' && github.event_name != 'pull_request'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.TOOLCHAIN_CACHE }}
          key: mxe-gcc11.2-x86_64-${{ hashFiles('build-scripts/mxe-x86_64-gcc11.2-sha256', 'build-scripts/libbacktrace-x86_64-w64-mingw32-sha256') }}

      - name: Install verified MXE toolchain
        run: |
          cd "${TOOLCHAIN_CACHE}"
          sudo tar -xJf mxe-x86_64.tar.xz -C /opt
          sudo tar -xzf libbacktrace-x86_64-w64-mingw32.tar.gz \
            --exclude=LICENSE \
            -C /opt/mxe/usr/x86_64-w64-mingw32.static.gcc11

      - name: Restore compiler cache
        id: compiler-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-windows-gcc11-${{ github.sha }}
          restore-keys: ccache-windows-gcc11-

      - name: Build and package Windows distribution
        shell: bash
        run: |
          set -euo pipefail
          cross="/opt/mxe/usr/bin/x86_64-w64-mingw32.static.gcc11-"
          test -x "${cross}g++"
          "${cross}g++" --version
          ccache --zero-stats
          ccache --max-size "${CCACHE_MAXSIZE}"

          build_sha="${GITHUB_SHA:0:12}"
          version="0.G-additive-${build_sha}"
          safe_ref=$(printf '%s' "${GITHUB_REF_NAME}" | tr -c 'A-Za-z0-9._-' '-')
          asset="cdda-0g-additive-asketmc-${safe_ref}-${build_sha}-windows-x64-tiles-sound.zip"
          source_epoch=$(git show -s --format=%ct "${GITHUB_SHA}")
          export SOURCE_DATE_EPOCH="${source_epoch}"
          output_dir="${GITHUB_WORKSPACE}/release-output"
          mkdir -p "${output_dir}"

          cat > VERSION.txt <<EOF
          build type: Windows x64 Tiles+Sound
          version: ${version}
          commit sha: ${GITHUB_SHA}
          commit url: https://github.com/${GITHUB_REPOSITORY}/commit/${GITHUB_SHA}
          EOF
          cat > BUILD_MANIFEST.txt <<EOF
          tag or ref: ${GITHUB_REF_NAME}
          commit sha: ${GITHUB_SHA}
          source date epoch: ${source_epoch}
          build flags: RELEASE=1 TILES=1 SOUND=1 LOCALIZE=0 BACKTRACE=1 LIBBACKTRACE=1 PCH=0
          mxe archive: $(cat build-scripts/mxe-x86_64-gcc11.2-sha256)
          libbacktrace archive: $(cat build-scripts/libbacktrace-x86_64-w64-mingw32-sha256)
          EOF
          if [[ "${RELEASE_BUILD}" == "true" ]]; then
            {
              echo "release notes sha256: $(sha256sum release-source/RELEASE_NOTES.md | cut -d' ' -f1)"
              echo "release metadata sha256: $(sha256sum release-source/RELEASE_METADATA.json | cut -d' ' -f1)"
              echo "cumulative changelog sha256: $(sha256sum CHANGELOG.md | cut -d' ' -f1)"
              echo "cumulative overview sha256: $(sha256sum PATCHNOTES_ADDITIVE_0G.md | cut -d' ' -f1)"
            } >> BUILD_MANIFEST.txt
          fi

          build_distribution() {
            local build_prefix="$1"
            local use_ccache="$2"
            mkdir -p "${build_prefix}"
            make -j"$(nproc)" \
              "BUILD_PREFIX=${build_prefix}" \
              "JSON_FORMATTER_BIN=${build_prefix}json_formatter.exe" \
              "VERSION=${version}" \
              "CROSS=${cross}" \
              "CCACHE=${use_ccache}" RELEASE=1 TILES=1 SOUND=1 LOCALIZE=0 RUNTESTS=0 \
              LINTJSON=0 ASTYLE=0 WARNINGS=-w BACKTRACE=1 LIBBACKTRACE=1 PCH=0 \
              BINDIST_CMD=: \
              bindist
            test -s "${build_prefix}cataclysm-tiles.exe"
            file "${build_prefix}cataclysm-tiles.exe" | grep -q "PE32+ executable"
            dist_dir="${build_prefix}bindist"
            test -d "${dist_dir}"
            cp BUILD_MANIFEST.txt "${dist_dir}/BUILD_MANIFEST.txt"
            if [[ "${RELEASE_BUILD}" == "true" ]]; then
              cp release-source/RELEASE_NOTES.md "${dist_dir}/RELEASE_NOTES.md"
              cp release-source/RELEASE_METADATA.json "${dist_dir}/RELEASE_METADATA.json"
              cp CHANGELOG.md "${dist_dir}/CHANGELOG.md"
              cp PATCHNOTES_ADDITIVE_0G.md "${dist_dir}/PATCHNOTES_ADDITIVE_0G.md"
            fi
            python3 tools/package_windows_release.py \
              "${dist_dir}" "${output_dir}/${asset}" "${source_epoch}"
            verify_args=(--verify "${output_dir}/${asset}" "${GITHUB_SHA}" "${version}")
            if [[ "${RELEASE_BUILD}" == "true" ]]; then
              verify_args+=(--release-tag "${GITHUB_REF_NAME}")
            fi
            python3 tools/package_windows_release.py "${verify_args[@]}"
          }

          first_prefix="build-one/"
          cache_mode=1
          if [[ "${RELEASE_BUILD}" == "true" ]]; then
            cache_mode=0
          fi
          build_distribution "${first_prefix}" "${cache_mode}"
          make -j"$(nproc)" \
            "BUILD_PREFIX=${first_prefix}" \
            "JSON_FORMATTER_BIN=${first_prefix}json_formatter.exe" \
            "VERSION=${version}" \
            "CROSS=${cross}" \
            "CCACHE=${cache_mode}" RELEASE=1 TILES=1 SOUND=1 LOCALIZE=0 RUNTESTS=1 \
            LINTJSON=0 ASTYLE=0 WARNINGS=-w BACKTRACE=1 LIBBACKTRACE=1 PCH=0 \
            TEST_SOURCES="test_main.cpp fake_messages.cpp map_helpers.cpp player_helpers.cpp climbing_test.cpp npc_hostility_test.cpp" \
            tests
          test_bin="tests/${first_prefix}cata_test.exe"
          test -s "${test_bin}"
          wine_bin="$(command -v wine || command -v wine64)"
          WINEDEBUG=-all timeout 10m "${wine_bin}" "${test_bin}" \
            --user-dir=climbing-test-user --rng-seed 1 --reporter junit \
            --out climbing-test-results.xml "[climbing][z-level]"
          WINEDEBUG=-all timeout 10m "${wine_bin}" "${test_bin}" \
            --user-dir=npc-hostility-test-user --rng-seed 1 --reporter junit \
            --out npc-hostility-test-results.xml "[npc][morale][hostility]"
          python3 - <<'PY'
          import xml.etree.ElementTree as ET

          for label, path in (
              ("climbing", "climbing-test-results.xml"),
              ("NPC hostility", "npc-hostility-test-results.xml"),
          ):
              root = ET.parse(path).getroot()
              cases = root.findall(".//testcase")
              failures = root.findall(".//failure") + root.findall(".//error")
              if not cases:
                  raise SystemExit(f"focused {label} gate discovered zero test cases")
              if failures:
                  raise SystemExit(f"focused {label} gate reported {len(failures)} failures")
              print(f"focused {label} gate passed {len(cases)} test cases")
          PY
          first_exe=$(sha256sum "${first_prefix}cataclysm-tiles.exe" | cut -d' ' -f1)
          first_zip=$(sha256sum "${output_dir}/${asset}" | cut -d' ' -f1)

          if [[ "${RELEASE_BUILD}" == "true" ]]; then
            second_prefix="build-two/"
            build_distribution "${second_prefix}" 0
            second_exe=$(sha256sum "${second_prefix}cataclysm-tiles.exe" | cut -d' ' -f1)
            second_zip=$(sha256sum "${output_dir}/${asset}" | cut -d' ' -f1)
            test "${first_exe}" = "${second_exe}"
            test "${first_zip}" = "${second_zip}"
          fi

          cp BUILD_MANIFEST.txt "${output_dir}/BUILD_MANIFEST.txt"
          if [[ "${RELEASE_BUILD}" == "true" ]]; then
            cp release-source/RELEASE_NOTES.md "${output_dir}/RELEASE_NOTES.md"
            python3 tools/release_changelog.py build-asset-manifest \
              --tag "${GITHUB_REF_NAME}" \
              --commit "${GITHUB_SHA}" \
              --archive "${output_dir}/${asset}" \
              --notes "${output_dir}/RELEASE_NOTES.md" \
              --build-manifest "${output_dir}/BUILD_MANIFEST.txt" \
              --metadata release-source/RELEASE_METADATA.json \
              --output "${output_dir}/RELEASE_MANIFEST.json"
            (
              cd "${output_dir}"
              sha256sum BUILD_MANIFEST.txt RELEASE_MANIFEST.json RELEASE_NOTES.md "${asset}" \
                | LC_ALL=C sort -k2 > SHA256SUMS.txt
            )
          else
            ( cd "${output_dir}" && sha256sum "${asset}" > SHA256SUMS.txt )
          fi
          ccache --show-stats

      - name: Save compiler cache for trusted events
        if: github.event_name != 'pull_request' && steps.compiler-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-windows-gcc11-${{ github.sha }}

      - name: Stage requested Windows build
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-build-${{ github.sha }}
          path: |
            release-output/cdda-0g-additive-asketmc-*-windows-x64-tiles-sound.zip
            release-output/SHA256SUMS.txt
            release-output/BUILD_MANIFEST.txt
          if-no-files-found: error
          retention-days: 1

      - name: Stage tagged release bundle
        if: env.RELEASE_BUILD == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-release
          path: |
            release-output/cdda-0g-additive-asketmc-*-windows-x64-tiles-sound.zip
            release-output/SHA256SUMS.txt
            release-output/BUILD_MANIFEST.txt
            release-output/RELEASE_NOTES.md
            release-output/RELEASE_MANIFEST.json
          if-no-files-found: error
          retention-days: 1

  validate-windows-release:
    name: Validate packaged Windows release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v0.G-additive-')
    needs: windows-compile
    runs-on: windows-2025
    timeout-minutes: 30
    permissions:
      # Same-run artifact download only; nothing here writes to the repository.
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: windows-release
          path: release-output
      - name: Verify checksums, manifests, and embedded release documents
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.sha }}
          EXPECTED_TAG: ${{ github.ref_name }}
        run: |
          python tools/release_changelog.py verify-assets \
            --manifest release-output/RELEASE_MANIFEST.json \
            --directory release-output \
            --expected-tag "${EXPECTED_TAG}" \
            --expected-commit "${EXPECTED_SHA}"
      - name: Verify, extract, and run packaged build
        shell: pwsh
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          $ErrorActionPreference = 'Stop'
          Push-Location release-output
          try {
            $archives = @(Get-ChildItem -File -Filter 'cdda-0g-additive-asketmc-*-windows-x64-tiles-sound.zip')
            if ($archives.Count -ne 1) { throw "Expected exactly one release archive, found $($archives.Count)" }
            $archive = $archives[0]
            Expand-Archive -LiteralPath $archive.FullName -DestinationPath extracted
            $exe = Get-Item -LiteralPath 'extracted\cataclysm-tiles.exe'
            if ($exe.Length -le 0) { throw 'Packaged executable is empty' }
            $version = Get-Content -Raw -LiteralPath 'extracted\VERSION.txt'
            if ($version -notmatch [regex]::Escape($env:EXPECTED_SHA)) { throw 'Packaged VERSION.txt lacks the full commit SHA' }
            $manifest = Get-Content -Raw -LiteralPath 'extracted\BUILD_MANIFEST.txt'
            if ($manifest -notmatch [regex]::Escape($env:EXPECTED_SHA)) { throw 'Packaged manifest lacks the full commit SHA' }
            Push-Location extracted
            try {
              $checkMods = Start-Process -FilePath '.\cataclysm-tiles.exe' -ArgumentList @('--check-mods', 'dda') -NoNewWindow -Wait -PassThru
              if ($checkMods.ExitCode -ne 0) { throw "--check-mods dda failed with exit code $($checkMods.ExitCode)" }
            } finally {
              Pop-Location
            }
          } finally {
            Pop-Location
          }

  publish-release:
    name: Publish tagged prerelease
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v0.G-additive-')
    needs: validate-windows-release
    runs-on: ubuntu-24.04
    permissions:
      contents: write # Create the prerelease and upload its immutable assets.
      id-token: write # Sigstore OIDC identity for build provenance.
      attestations: write # Record the provenance attestation for this repository.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: windows-release
          path: release-output
      - name: Verify and publish immutable release assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          python3 tools/release_changelog.py verify-assets \
            --manifest release-output/RELEASE_MANIFEST.json \
            --directory release-output \
            --expected-tag "${GITHUB_REF_NAME}" \
            --expected-commit "${GITHUB_SHA}"
          cd release-output
          mapfile -t assets < <(find . -maxdepth 1 -name 'cdda-0g-additive-asketmc-*-windows-x64-tiles-sound.zip' -print)
          test "${#assets[@]}" -eq 1
          asset="${assets[0]}"
          sha256sum --check SHA256SUMS.txt
          release_title=$(python3 -c 'import json; print(json.load(open("RELEASE_MANIFEST.json", encoding="utf-8"))["title"])')
          if ! gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release create "${GITHUB_REF_NAME}" \
              "${asset}" BUILD_MANIFEST.txt RELEASE_MANIFEST.json RELEASE_NOTES.md SHA256SUMS.txt \
              --verify-tag \
              --prerelease \
              --title "${release_title}" \
              --notes-file RELEASE_NOTES.md
          fi
          mkdir existing
          asset_name=$(basename "${asset}")
          test "$(gh release view "${GITHUB_REF_NAME}" --json name --jq '.name')" = "${release_title}"
          test "$(gh release view "${GITHUB_REF_NAME}" --json isDraft --jq '.isDraft')" = "false"
          gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${GITHUB_REF_NAME}" \
            --jq '.body | @base64' | base64 --decode > existing/RELEASE_BODY.md
          cmp RELEASE_NOTES.md existing/RELEASE_BODY.md
          mapfile -t remote_assets < <(gh release view "${GITHUB_REF_NAME}" --json assets --jq '.assets[].name' | sort)
          mapfile -t expected_assets < <(printf '%s\n' "${asset_name}" BUILD_MANIFEST.txt RELEASE_MANIFEST.json RELEASE_NOTES.md SHA256SUMS.txt | sort)
          test "${#remote_assets[@]}" -eq 5
          test "${remote_assets[*]}" = "${expected_assets[*]}"
          gh release download "${GITHUB_REF_NAME}" \
            --pattern "${asset_name}" \
            --pattern BUILD_MANIFEST.txt \
            --pattern RELEASE_MANIFEST.json \
            --pattern RELEASE_NOTES.md \
            --pattern SHA256SUMS.txt \
            --dir existing
          cmp SHA256SUMS.txt existing/SHA256SUMS.txt
          cmp BUILD_MANIFEST.txt existing/BUILD_MANIFEST.txt
          cmp RELEASE_MANIFEST.json existing/RELEASE_MANIFEST.json
          cmp RELEASE_NOTES.md existing/RELEASE_NOTES.md
          cmp "${asset}" "existing/${asset_name}"
          ( cd existing && sha256sum --check SHA256SUMS.txt )

      - name: Attest build provenance for the published archive
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: release-output/cdda-0g-additive-asketmc-*-windows-x64-tiles-sound.zip
